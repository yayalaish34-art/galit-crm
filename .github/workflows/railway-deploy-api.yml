# Deploy apps/api to Railway on every push to main that touches apps/api.
#
# Setup (one-time):
#   1. Railway dashboard → project `galit-crm` → Settings → Tokens → "Create Token"
#      → copy the project token.
#   2. GitHub repo → Settings → Secrets and variables → Actions → "New repository secret"
#      → Name: RAILWAY_TOKEN · Value: the token from step 1.
#
# The frontend (apps/web) stays on Vercel — Vercel's own GitHub integration deploys it
# automatically from this same repo, so we only wire Railway here.

name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/railway-deploy-api.yml'
  workflow_dispatch: {} # allow manual re-deploy from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (service: api)
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --ci
